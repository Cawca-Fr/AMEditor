plugins {
    id 'com.android.application'
    id 'org.lsposed.lsparanoid' version '0.6.0'
    id 'top.niunaijun.blackobfuscator'
}

android {
    namespace 'com.cawcafr.ameditor'
    compileSdk 36

    defaultConfig {
        applicationId "com.cawcafr.ameditor"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        // Enable desugaring to support apksig
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Configuration LSParanoid
    packagingOptions {
        resources.excludes.add('META-INF/services/javax.xml.parsers.SAXParserFactory')
        resources.excludes.add('META-INF/services/javax.xml.parsers.DocumentBuilderFactory')
    }
}

lsparanoid {
    seed = 2024
}

// Force BlackObfuscator to run after R8
tasks.configureEach { task ->
    if (task.name.contains('transformClassesAndResourcesWithR8')) {
        task.finalizedBy 'blackObfuscator'
    }
}

BlackObfuscator {
    enabled true
    depth 2

    // Only obfuscate personal code — never third-party libs
    obfClass = [
            "com.cawcafr.ameditor"
    ]

    // Exclude Main Activities and classe
    blackClass = [
            "com.cawcafr.ameditor.MainActivity",
            "com.cawcafr.ameditor.XmlPreviewActivity",
            "com.cawcafr.ameditor.util.CustomPatchActivity"
    ]
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.core
    implementation libs.androidx.core.ktx.v1160
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity.ktx
    implementation libs.commons.io.v2200
    implementation libs.prov
    implementation libs.bcpkix.jdk15on
    implementation libs.xercesimpl
    implementation libs.commons.lang3
    implementation libs.log4j
    implementation libs.apksig
    implementation libs.bcprov.jdk18on
}
